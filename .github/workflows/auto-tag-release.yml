name: auto-tag-release

# Auto-tags a release-PR merge commit (#411) so `release.yml` can publish the GitHub
# Release without a trailing manual `git tag` step. This workflow creates and pushes
# the annotated tag, then regenerates tag-derived generator-owned docs (#978) so
# CHANGELOG.md includes the new version before the next PR hits docs:check. It never
# publishes a GitHub Release itself — that stays entirely in release.yml, reached
# only via the `v*` tag push this workflow produces.
#
# GitHub does not re-trigger other workflows for events created by the default
# GITHUB_TOKEN, so the tag push and the follow-up docs commit push authenticate with
# the RELEASE_TAG_TOKEN repo secret (a fine-grained PAT / GitHub App token with
# `contents: write`, or a write-scoped SSH deploy key) instead. GITHUB_TOKEN alone
# would push the tag but release.yml would silently never run — reproducing the
# exact bug the tag step fixes. The same contents:write secret is required for the
# post-tag CHANGELOG commit push; if the secret can push tags but not commits,
# the docs-refresh step fails closed with an explicit error (tag remains).
#
# Detection requires BOTH the commit subject matching the `pipeline release` title
# format AND core/package.json's version agreeing with the subject's version, so a
# feature commit that happens to start with "release:" can never tag by accident.
# The detection pattern below is single-sourced and drift-guarded by
# core/test/auto-tag-release-workflow.test.ts against release.ts's title format.
# A subsequent push of the docs regenerate commit (subject `docs: regenerate
# CHANGELOG for vX.Y.Z`) is a successful no-op for tagging (subject does not match).
#
# Setup: RELEASE_TAG_TOKEN must be provisioned (a fine-grained PAT with
# `contents: read` + `contents: write` on this repo, added as a repository Actions
# secret named RELEASE_TAG_TOKEN) before a release merge can push the tag or the
# post-tag docs commit. Checkout uses the default GITHUB_TOKEN, so non-release
# pushes to main are unaffected by whether the secret is provisioned.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags

      - name: Detect release merge (subject)
        id: detect
        run: |
          subject="$(git log -1 --format=%s)"
          echo "Commit subject: $subject"
          # Detection pattern — single source of truth for this workflow's release
          # detection; do not restate it elsewhere. Kept in lock-step with the title
          # `release.ts` builds (`release: X.Y.Z — <theme>`, em dash separator) by
          # core/test/auto-tag-release-workflow.test.ts.
          pattern='^release: ([0-9]+\.[0-9]+\.[0-9]+) — .*$'
          if [[ "$subject" =~ $pattern ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release merge commit (subject does not match) — no-op."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.is_release == 'true'
        with:
          node-version: "24"

      - name: Cross-check core/package.json version
        id: version_check
        if: steps.detect.outputs.is_release == 'true'
        run: |
          version="${{ steps.detect.outputs.version }}"
          pkg_version="$(node -p "require('./core/package.json').version")"
          if [ "$pkg_version" == "$version" ]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Subject looked like a release for v${version} but core/package.json is v${pkg_version} — skipping (no tag)."
          fi

      - name: Check whether the tag already exists
        id: exists
        if: steps.version_check.outputs.matched == 'true'
        run: |
          version="${{ steps.detect.outputs.version }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${version}")" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${version} already exists on origin — no-op (a fallback tag push likely raced this workflow)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # FRG guard (#757 / #1040): fail closed before any tag create/push when
      # release-eligible evidence for this version is missing, unparsable,
      # pass:false, or lacks a valid HMAC attestation. Uses the same shared
      # --validate-tag validator as pipeline factory-gate. Evidence must be
      # committed on the release PR under .agent-pipeline/frg/<version>/latest.json
      # and signed with PIPELINE_FRG_ATTESTATION_KEY (hand-authored self-consistent
      # JSON without the secret is rejected). Missing or failed evidence is
      # remediable via factory-release prepare / the Tugboat FRG pack phase.
      - name: Verify Factory Reliability Gate evidence
        id: frg
        if: steps.exists.outputs.exists == 'false'
        continue-on-error: true
        env:
          PIPELINE_FRG_ATTESTATION_KEY: ${{ secrets.PIPELINE_FRG_ATTESTATION_KEY }}
        run: |
          version="${{ steps.detect.outputs.version }}"
          if [ -z "${PIPELINE_FRG_ATTESTATION_KEY}" ]; then
            echo "::error::PIPELINE_FRG_ATTESTATION_KEY secret is required to verify FRG attestation before tagging. Remediation: run factory-release prepare or the Tugboat FRG pack phase so .agent-pipeline/frg/${version}/latest.json is a release-eligible pass, and provision PIPELINE_FRG_ATTESTATION_KEY."
            exit 1
          fi
          node --experimental-strip-types core/scripts/factory-reliability-gate.ts \
            --validate-tag "${version}"
          echo "frg_ok=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(git log -1 --format=%b)"
          if ! printf '%s' "$body" | grep -q '[^[:space:]]'; then
            echo "Merge-commit body is empty — falling back to the release PR body."
            subject="$(git log -1 --format=%s)"
            pr_number=""
            if [[ "$subject" =~ \(#([0-9]+)\)$ ]]; then
              pr_number="${BASH_REMATCH[1]}"
            else
              # Raw release subject (no squash "(#N)" suffix) — resolve the merged
              # PR from the merge commit itself via GitHub's commits→PRs API.
              pr_number="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')"
            fi
            if [ -n "$pr_number" ]; then
              body="$(gh pr view "$pr_number" --json body --jq .body)"
            fi
          fi
          if ! printf '%s' "$body" | grep -q '[^[:space:]]'; then
            echo "::error::No non-empty release notes could be resolved from the merge-commit body or the release PR body for v${{ steps.detect.outputs.version }}."
            exit 1
          fi
          printf '%s\n' "$body" > /tmp/release-notes.md

      - name: Create and push annotated tag
        if: steps.exists.outputs.exists == 'false'
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "::error::RELEASE_TAG_TOKEN is empty/absent — this release merge cannot be tagged. Provision a fine-grained PAT with 'contents: read' and 'contents: write' on this repository, and add it as a repository Actions secret named RELEASE_TAG_TOKEN."
            exit 1
          fi
          version="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # actions/checkout persists the default GITHUB_TOKEN as an
          # `http.https://github.com/.extraheader` config entry, which applies to
          # any https://github.com/ URL — including the PAT-embedded push URL
          # below. Unset it so this push can't silently authenticate with
          # GITHUB_TOKEN (untriggering release.yml) instead of RELEASE_TAG_TOKEN.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git tag -a "v${version}" -F /tmp/release-notes.md "${{ github.sha }}"
          git push "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/v${version}"

      # #978: CHANGELOG.md is generated from git tags. After the annotated tag
      # exists, regenerate generator-owned docs and push a non-empty commit when
      # dirt is present so the next PR does not fail docs:check solely for a
      # missing just-shipped version section. Fail closed without deleting the tag.
      - name: Install core deps for docs generator
        if: steps.version_check.outputs.matched == 'true'
        run: cd core && npm ci --no-audit --no-fund

      - name: Regenerate tag-derived CHANGELOG
        if: steps.version_check.outputs.matched == 'true'
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "::error::RELEASE_TAG_TOKEN is empty/absent — cannot push post-tag CHANGELOG refresh. Provision a fine-grained PAT with 'contents: read' and 'contents: write' on this repository (same secret used for tag push), and add it as RELEASE_TAG_TOKEN."
            exit 1
          fi
          version="${{ steps.detect.outputs.version }}"
          # Tag may already have existed (race) or was just pushed above — ensure
          # this checkout can observe refs/tags/vX.Y.Z for the generator.
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Annotated tag v${version} is not visible after fetch — cannot regenerate tag-derived CHANGELOG. Tag was not deleted; heal after the tag is present."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Same extraheader pitfall as the tag-push step: clear checkout's
          # GITHUB_TOKEN so commit push authenticates with RELEASE_TAG_TOKEN.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${{ github.repository }}.git"
          # actions/checkout leaves a detached SHA. Attach a local branch that
          # tracks origin/<default> so release-docs-refresh's bare `git push`
          # can update the default branch (detached HEAD rejects a bare push).
          # Fail closed if sync fails — do not leave main stale silently.
          branch="${{ github.ref_name }}"
          if ! git fetch origin "${branch}"; then
            echo "::error::Could not fetch origin/${branch} for post-tag CHANGELOG refresh. Tag was not deleted."
            exit 1
          fi
          if ! git checkout -B "${branch}" "origin/${branch}"; then
            echo "::error::Could not check out local branch '${branch}' tracking origin/${branch} — post-tag CHANGELOG commit cannot be pushed from a detached Actions checkout. Tag was not deleted."
            exit 1
          fi
          if [ "$(git branch --show-current)" != "${branch}" ]; then
            echo "::error::Expected HEAD on branch '${branch}' for docs push; got '$(git branch --show-current || echo detached)'. Tag was not deleted."
            exit 1
          fi
          node scripts/release-docs-refresh.mjs --version "${version}" --push
