name: release

# Publish a GitHub Release for an annotated vX.Y.Z tag at exact candidate C.
# Tag push and a bounded recovery workflow_dispatch share this one job.
# The CLI never creates or edits a Release. Post-tag docs may advance main
# and never retarget the released tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated tag (vX.Y.Z)
        required: true
        type: string
      candidate:
        description: Exact 40-hex candidate SHA C
        required: true
        type: string

permissions:
  contents: write # required to create GitHub Releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the annotation is available

      - name: Resolve tag and candidate
        id: identity
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            C="$(printf '%s' "${INPUT_CANDIDATE}" | tr '[:upper:]' '[:lower:]')"
          else
            TAG="${GITHUB_REF_NAME}"
            C="$(git rev-parse HEAD)"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag ${TAG} is not vX.Y.Z"; exit 1 ;;
          esac
          if ! printf '%s' "$C" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::candidate ${C} is not an exact 40-hex SHA"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "candidate=${C}" >> "$GITHUB_OUTPUT"

      - name: Fetch and check out the annotated tag
        run: |
          set -euo pipefail
          TAG="${{ steps.identity.outputs.tag }}"
          git fetch origin --force "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout --detach "refs/tags/${TAG}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Guard annotated tag, package versions, and origin/main
        run: |
          set -euo pipefail
          TAG="${{ steps.identity.outputs.tag }}"
          C="${{ steps.identity.outputs.candidate }}"
          obj_type="$(git cat-file -t "${TAG}")"
          if [ "$obj_type" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag (object type: ${obj_type}). Push an annotated tag (-a)."
            exit 1
          fi
          peeled="$(git rev-parse "${TAG}^{}")"
          if [ "$peeled" != "$C" ]; then
            echo "::error::${TAG} peels to ${peeled}, expected candidate ${C}"
            exit 1
          fi
          ver="${TAG#v}"
          root="$(node -p "require('./package.json').version")"
          core="$(node -p "require('./core/package.json').version")"
          if [ "$root" != "$ver" ] || [ "$core" != "$ver" ]; then
            echo "::error::tag ${TAG} does not match root (${root}) and core (${core}) package versions"
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          main="$(git rev-parse origin/main)"
          if [ "$main" != "$C" ]; then
            echo "::error::origin/main ${main} is not candidate ${C}; refusing publication. Tags are never force-moved or deleted. This is the documented non-atomic tag-boundary race; Git cannot atomically create a tag while asserting an unrelated protected main ref remains C."
            exit 1
          fi

      - name: Publish GitHub Release from the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -l "${TAG}" --format='%(contents)' > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "::error::${TAG} has an empty or whitespace-only annotation message. Annotate the tag with release notes before pushing."
            exit 1
          fi
          if [[ "${TAG}" == *-* ]]; then
            flag="--prerelease"
          else
            flag="--latest --prerelease=false"
          fi
          # Status-aware lookup equivalent to isHttp404Signal + isGithubAuthOrPermissionError.
          # Only an exact-tag HTTP 404 that is not auth-shaped is absence.
          set +e
          view_err="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/tmp/release-view.err)"
          view_status=$?
          set -e
          err="$(cat /tmp/release-view.err)"
          lower="$(printf '%s' "$err" | tr '[:upper:]' '[:lower:]')"
          classify() {
            case "$1" in
              *'http 401'*|*'http 403'*|*'status code: 401'*|*'status code: 403'*|*'bad credentials'*|*'resource not accessible'*|*'authentication'*|*'permission denied'*|*'must have push access'*|*'required scopes'*)
                echo unknown_auth ;;
              *'http 404'*|*'status code: 404'*|*'status code 404'*)
                echo absent ;;
              *)
                echo unknown ;;
            esac
          }
          if [ "$view_status" -eq 0 ]; then
            gh release edit "${TAG}" \
              --notes-file /tmp/notes.md \
              --title "${TAG}" \
              --draft=false \
              $flag
          else
            class="$(classify "$lower")"
            if [ "$class" != "absent" ]; then
              echo "::error::GitHub Release ${TAG} observation is unknown (${class}): ${err}"
              exit 1
            fi
            gh release create "${TAG}" \
              --verify-tag \
              --notes-file /tmp/notes.md \
              --title "${TAG}" \
              $flag
          fi

      # Sole post-tag docs owner (#1563). Check out current main before installing
      # dependencies. The released tag remains fixed at C.
      - name: Check out current main before docs
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Install dependencies for tag-derived docs
        run: cd core && npm ci --no-audit --no-fund

      - name: Refresh tag-derived docs on main
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "::error::RELEASE_TAG_TOKEN is required for post-tag docs refresh"
            exit 1
          fi
          released="$(git rev-parse "${TAG}^{}")"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${{ github.repository }}.git"
          node scripts/release-docs-refresh.mjs --version "${TAG#v}" --push
          observed="$(git rev-parse "${TAG}^{}")"
          test "$observed" = "$released" || { echo "::error::release tag moved during docs refresh"; exit 1; }
