# Pipeline configuration for this repo — synced with `pipeline config sync`.
# Every key is shown at its current default value; edit any line to override.
# Delete a key to fall back to the built-in default. Lines that are commented
# out (e.g. the `command:` entries) are optional overrides — uncomment to set.

domain_name: agent-pipeline # human-readable project name used in prompts
domain_description: a cross-tool GitHub issue→ready-to-deploy pipeline skill (Claude Code + Codex) # short project description used in prompts

base_branch: main # branch PRs target and worktrees branch from
worktree_root: .worktrees # dir (relative to repo) holding pipeline worktrees
max_concurrent_worktrees: 5 # cap on simultaneous in-flight worktrees
auto_recovery_max_retries: 2 # auto-recovery attempts when implementation blocks
implementation_timeout: 2400 # seconds for the implementation harness
review_timeout: 1500 # seconds per review stage
plan_review_timeout: 900 # seconds for the plan-review harness (shorter cap; fails fast on runaway review)
fix_timeout: 2400 # seconds per fix stage
intake_timeout: 600 # seconds for the intake harness call before timing out
sweep_timeout: 600 # seconds for the sweep harness call before timing out
ci_timeout: 900 # seconds to wait for CI at pre-merge
ci_poll_interval: 30 # seconds between CI status polls
ci_no_run_grace_s: 60 # seconds to wait before checking for zero check-runs when CI appears pending; set to 0 to check immediately

harnesses:
  implementer: grok
  reviewer: codex

models: # current Grok factory roles use exactly grok-4.5; no Grok fallback is configured
  planning: grok-4.5 # implementer harness
  implementing: grok-4.5 # implementer harness
  review: gpt-5.6-terra # reviewer harness
  fix: grok-4.5 # implementer harness
  intake: grok-4.5 # implementer harness; explicit so doctor smoke never inherits a non-Grok default
  sweep: grok-4.5 # implementer harness; explicit so doctor smoke never inherits a non-Grok default

effort: # per-phase reasoning effort — passed through each resolved harness adapter (#366, #608).
  planning: high # implementer harness — also sources plan-review's effort (Adversarial/Definitive)
  implementing: high # implementer harness
  review: high # reviewer harness
  fix: high # implementer harness
#   intake: low # intake spec-generation — always the claude harness
#   sweep: low # sweep spec-generation — always the claude harness

# review_harness: my-reviewer # override the reviewer CLI for the review step (default: the profile's reviewer). The CLI receives the JSON-verdict prompt as a positional arg and must print a fenced JSON verdict block on stdout. The implementer harness is not configurable.
#   Or a structured form for independent reviewer model/effort control:
# review_harness:
#   command: my-reviewer
#   model: auto # or an explicit alias
#   effort: auto # or an explicit level (round-aware: review-1 Iterative, review-2/plan-review Definitive)

openspec:
  enabled: auto # auto | on | off
  bootstrap: false # if true, run `openspec init` on repos lacking openspec/

last30days:
  enabled: false # opt-in pre-planning activity brief
  timeout: 600 # seconds

steps: # turn optional steps off for speed/preference (default: all on)
  plan_review: true # cross-harness review of the plan before coding
  standard_review: true # review-1 (and its fix round)
  adversarial_review: true # review-2 (and its fix round)
  docs: true # include the docs-update instruction in the implementing prompt

test_gate: # run the repo's tests/build before opening a PR
  enabled: true # set false to disable entirely
  command: npm run ci # explicit command; auto-detected when absent
  max_attempts: 3 # fix-harness invocations before blocking
  timeout: 300 # seconds per test/build run

eval_gate: # run the repo's eval harness after pre-merge
  enabled: false # set true to enable (one-time declaration per repo)
  # command: pnpm evals # shell command to run; required when enabled
  mode: gate # gate: block on fail | advisory: record and advance
  timeout: 300 # stage-level budget in seconds (shared across attempts)
  max_attempts: 2 # total attempts before giving up (1 = no retry)

# shipcheck_gate: # reviewer-owned acceptance rubric after eval-gate (#148). Disabled by default.
#   enabled: false # set true to enable
#   mode: advisory # advisory: record findings without blocking | gate: block on fail
#   max_rounds: 1 # max reviewer invocations before needs-human
#   rubric_path: .github/shipcheck-rubric.md # repo-root-relative path to Markdown rubric file
#   block_on_partial: false # when true and mode=gate, partial verdict also blocks

review_policy: # which review findings block progression vs. merely advise (#17)
  block_threshold: high # critical|high|medium|low — findings below this advise, not block (set 'low' to block on every finding)
  min_confidence: 0.85 # 0..1 — findings below this confidence advise, not block
  max_adversarial_rounds: 3 # cap review-round re-runs; after this, still-blocking findings go advisory and the item routes to needs-human
  # risk_proportional: false # when true and review-1 approved with 0 findings, review-2 only blocks on high/critical findings (#232)
  # ceiling_action: park # park (default): hard-park at needs-human; demote_and_advance: auto-demote below-high findings and advance (#233)
  # surface_recurrence_rounds: 3 # same-surface recurrence guard; 0 disables (#234)

doctor: # deterministic preflight capability check (#146) — run `pipeline doctor` standalone, or enable run-start gating here
  runOnStart: true # run the preflight checks before planning and abort the run on any failure
  failFast: false # if true, stop at the first failing check instead of collecting all failures

# auto_loop: # bounded auto-loop mode (#149) — opt-in; disabled by default
#   enabled: false # set true to enable; when false (default) the advance loop is byte-for-byte unchanged
#   max_rounds: 3 # maximum automatic continuations per run before parking at needs-human
#   max_wallclock_minutes: 60 # wall-clock budget in minutes (independent of max_rounds)
#   # stages: [eval-gate, shipcheck-gate] # allowlisted stages eligible for automatic continuation
#   #   Known stages: backlog, ready, planning, plan-review, implementing,
#   #                 review-1, fix-1, review-2, fix-2, pre-merge, eval-gate,
#   #                 shipcheck-gate, ready-to-deploy, needs-human

# setup_command: "pnpm install" # shell command to run in the worktree after creation, before the test gate (#174)
#   Auto-detected from lockfile when absent (pnpm-lock.yaml -> pnpm install, yarn.lock -> yarn install, package-lock.json -> npm ci)
#   Set to "" to skip the install step entirely (opt-out). Examples:
#     setup_command: ""                                       # opt-out
#     setup_command: "pnpm install --frozen-lockfile"         # override auto-detection
#     setup_command: "pnpm install && pnpm run build:types"   # multi-step setup

# format_gate: [] # run formatter/linter commands after the implementing and fix-round harnesses (#182)
#   Each entry runs in the worktree root. auto_fix: true commits any changes and re-runs to verify;
#   auto_fix: false blocks immediately on non-zero exit. Default: [] (no gate; existing behavior).
#   Examples (Rust repo):
#     - command: cargo fmt
#       auto_fix: true
#     - command: cargo clippy -D warnings
#       auto_fix: false
#   Examples (JS/TS repo):
#     - command: eslint --fix src/
#       auto_fix: true

# harness_sandbox: false # set true to run the claude implementer with --permission-mode default
#   instead of bypassPermissions (#21). The codex harness is already sandboxed
#   via --full-auto and is unaffected. Default false -> current invocation unchanged.

# repo: "owner/name" # GitHub repository in 'owner/name' format (overrides auto-detected value). Auto-detected from the git remote when absent.

# conventions_md_path: "CONVENTIONS.md" # Repo-root-relative path to the conventions file embedded in stage prompts. Absent by default (no conventions file embedded).

supersede_mode: close # After managed PR create/reuse, dispose other open associated same-base PRs for the issue: "close" (default) with a pipeline-superseded comment, or "comment-only" (notice only, leave open).

ci_mode: github # Source of pre-merge CI verification: github (default) waits on gh pr checks; local relies on the current run's local test-gate result and skips the GitHub Actions wait.

pre_merge_ci_assertion_fix: true # Allow one surgical implementer fix attempt per head SHA for assertion-classified pre-merge CI failures.

pre_merge_ci_rerun_enabled: true # When true (default), allow one automatic failed-workflow re-run per head SHA for infra/unknown pre-merge CI failures.

design_gate: # risk-triggered design-interrogation gate (#436)
  enabled: false # 2026-08-15: off — architecture size trigger ran 2 Codex rounds on almost every ship item; no unique catch vs review-1/2 (see ship comments on #1074/#1071/#599/#1065)
  triggers: [concurrency, storage, auth, migration, infrastructure, public-api, architecture]
  extra_triggers: {}
  max_rounds: 2
  block_threshold: medium
  min_confidence: 0.6
  limits:
    max_decisions: 8
    max_field_chars: 4000
    max_artifact_bytes: 65536

visual_gate: # run the repo's E2E/visual suite after pre-merge and before eval-gate
  enabled: false # Enable the visual gate (set true to activate; one-time declaration per repo).
  # command: npx playwright test # Shell command to run the E2E/visual suite (required when enabled).
  mode: gate # gate: block on failure; advisory: record result and advance.
  timeout: 900 # Stage-level budget in seconds (shared across attempts).
  max_attempts: 2 # Total attempts before giving up (1 = no retry).
  artifacts_dir: .pipeline-visual # Worktree-relative directory the command writes screenshots/diffs/traces into.
  publish: false # Publish the deciding run's captured artifacts to the PR branch as a bounded, pipeline-internal commit (default false). (repo-history tradeoff — see README)

# loop: # pipeline:loop native-goal capability attestation (#506) — uncomment to override automatic detection
#   native_goal_attestation: auto # Operator attestation of the active engine's native /goal capability: "auto" (default) detects automatically; "available"/"unavailable" overrides detection.

papercuts: # agent-logged minor-friction capture (#419)
  enabled: true
  auto_file: false
  auto_file_window_hours: 24
  auto_file_max_per_window: 3
  auto_file_min_occurrences: 3

# corrections: # opt-in correction auto-file (#500) — uncomment to auto-file recurring correction_event clusters. Capture (#499) is unconditional and unaffected.
#   auto_file: false # When true, automatically file pipeline:backlog issues for recurring correction clusters at run_complete and queue-batch end. Single-host concurrency scope (#459) — see docs.
#   auto_file_window_hours: 24 # Trailing window (hours) over which correction_event records are clustered for auto-filing.
#   auto_file_max_per_window: 3 # Maximum number of issues auto-filed within the trailing window.
#   auto_file_min_occurrences: 2 # Minimum in-window distinct-occurrence count a correction cluster must meet to be auto-filed (floor 2).

# durable_runs: # opt-in durable-run-blocker auto-file (#538) — uncomment to auto-file terminal or recurring durable-run-blocker clusters at durable-run terminal stop/completion
#   auto_file: false # When true, automatically file pipeline:backlog issues for terminal or recurring durable-run-blocker clusters at durable-run terminal stop/completion.
#   auto_file_window_hours: 24 # Trailing window (hours) over which durable-run-blocker occurrences are clustered for auto-filing.
#   auto_file_max_per_window: 3 # Maximum number of issues auto-filed within the trailing window.
#   auto_file_min_occurrences: 2 # Minimum cross-run recurrence count a non-terminal durable-run-blocker cluster must meet to be auto-filed (floor 2). A terminal stop always qualifies from a single occurrence.

build_command: "npm run build" # keep generated plugin artifacts synchronized after fix/auto-fix edits (#387)
#   When declared, fix and auto-fix rounds run it after committing source edits and fold any
#   resulting generated-artifact changes (dist/, a plugin manifest, …) into the round commit,
#   so committed artifacts stay fresh and a CI artifact-drift check never fails on drift the
#   round itself introduced. Absent (default): no build runs, no auto-detection, no fallback.

# event_sink: # optional external event sink (#343) — uncomment to deliver run events.jsonl records to an operator-controlled forwarder. SECURITY: forwards run/stage/issue/PR event metadata to the configured command — treat it as a trusted destination.
#   command: "logger -t pipeline" # forwarder command; receives each event JSON line on stdin. Unset -> no sink (local events.jsonl only, unchanged).
#   mode: additive # additive (default): write events.jsonl AND deliver to the sink | exclusive: sink only (events.jsonl is not written)
#   Env overrides: PIPELINE_EVENT_SINK_COMMAND, PIPELINE_EVENT_SINK_MODE (win over file config). Delivery failures are non-fatal.

# product_fault: # privacy-safe upstream product-fault reporting (#502) — uncomment to enable 'pipeline report'. SECURITY: when enabled, an explicitly-confirmed report sends the sanitized payload to intake_endpoint — treat it as a trusted destination. Absent (default): fully inert — no network reporting, no GitHub issue.
#   enabled: false # set true to let 'pipeline report' build and (after explicit confirmation) submit a sanitized product-fault payload
#   intake_endpoint: "https://intake.example.com/product-fault" # maintainer-controlled intake service URL; absent -> pipeline report prepares a manual GitHub issue draft instead of submitting
#   intake_auth_env: "PRODUCT_FAULT_INTAKE_TOKEN" # name of an env var holding a submission-scoped credential — never a GitHub token, never stored here

# roadmap: # backlog roadmap engine overrides (#171) — uncomment to override; absent (default): built-in roadmap defaults apply
#   include_labels: [] # Include only issues with at least one of these labels.
#   exclude_labels: [] # Exclude issues that carry any of these labels.
#   score_weights: # Multiplier overrides for each scoring sub-factor (default: 1.0 each).
#     impact: 1.0
#     confidence: 1.0
#     ease: 1.0
#     risk_reduction: 1.0
#     dep_leverage: 1.0
#   hygiene_auto_apply: false # When true, hygiene actions are applied automatically with --apply (default: false).
#   pr_docs: true # When false, skip opening the roadmap.md PR (default: true).
#   release_model: semver # How the roadmap groups issues into milestones: 'semver' (default) bundles into version-numbered release lanes; 'continuous' groups by theme/epic for continuous delivery.
#   release_capacity: # Capacity policy for the semver release model. Controls per-milestone effort budget and breaking-change isolation. Absent block uses capacity-aware defaults.
#     effort_budget: 8 # Per-milestone effort-points capacity budget for the semver model (XS=1 S=2 M=3 L=5 XL=8). An issue with effort_points ≥ budget is isolated into its own milestone. Default: 8.
#     isolate_breaking: true # When true (default), each breaking-change issue is given its own milestone instead of sharing one with unrelated issues. Tunes capacity-aware semver milestone grouping.
#   inventory_concurrency: 4 # Maximum concurrent harness calls during inventory phase (default: 4).
#   depgraph_concurrency: 4 # Maximum concurrent harness calls during dependency verification (default: 4).
#   depgraph_verify_cap: 20 # Maximum candidates to source-verify; excess go to open_questions (default: 20).

# sweep: # sweep backlog maintenance thresholds (#168) — uncomment to override; absent (default): built-in thresholds apply
#   min_body_length: 150 # Minimum body character count for an issue to be considered sufficient (default: 150).
#   required_sections: ["Summary", "User story", "Acceptance criteria", "Out of scope"] # Section headings (without ##) that must be present for an issue to be considered sufficient (default: Summary, User story, Acceptance criteria, Out of scope).

# trusted_override_actors: [] # Additional GitHub identities whose override sentinels are trusted besides the current pipeline actor. (#229). Absent (default): only the current actor is trusted.
#   Grants override authority to each listed identity — SECURITY: it can dispose of blocking review findings without further review; keep this list minimal and audited.
#   e.g. trusted_override_actors: ["octocat"]

# queue: # queue batch factory operator defaults (#305) — uncomment to override. Precedence: CLI flags > these values > built-in defaults. Absent by default.
#   max_issues: 10 # Maximum number of issues to dispatch in a batch run (default: 10).
#   budget_dollars: null # Stop launching new runs when cumulative cost reaches this limit in USD; null means unlimited.
#   concurrency: 1 # Maximum simultaneously active pipeline runs (default: 1).
#   max_failure_rate: 1.0 # Halt new launches when failedCount/completedCount reaches this threshold (0.0–1.0); requires at least 3 completed runs (default: 1.0).

# auto_merge_eligibility: # auto-merge eligibility classification (#306). Disabled by default. SECURITY: informational classification only — the pipeline never merges (#4); a human still owns the merge button regardless of this setting.
#   enabled: false # Enable the auto-merge eligibility gate (default false). When false, the gate is a no-op.
#   max_diff_lines: 300 # Hard-deny if total PR diff lines (additions + deletions) exceed this threshold (default 300).
#   max_files: 10 # Hard-deny if changed file count exceeds this threshold (default 10).
#   deny_paths: [] # Additional glob patterns that always trigger needs-human regardless of other checks (default [])., e.g. ["infra/**", "**/migrations/**"]
#   allow_paths: [] # When non-empty, any changed file not covered by this list triggers needs-human (default []).
#   min_confidence: 0.8 # LLM judge confidence floor (0–1); outputs below this route to needs-human (default 0.8).

# merge_queue: # human-gated merge-queue defaults (#676/#675) — prepare-only release-when-complete; optional surgical repair; never auto_merge / never tags-publishes-merges release
#   release_when_complete: false # When true, merge-queue may prepare a release PR after a complete drive (still requires --release-version). Default false. Prepare-only: never tags, publishes, or merges the release.
#   repair: false # When true, merge-queue --apply may attempt deterministic-first then surgical/mechanical repair of conflict/CI holds (default false). Dry-run never repairs. Does not grant auto_merge.
#   repair_max_attempts: 1 # Max charged implementer repair attempts per held item per drive (default 1). 0 disables implementer repair while still allowing deterministic re-query.

# context_snapshot: # stage-aware issue context snapshot cap override (#318) — uncomment to override; absent (default): an 8000-character cap applies
#   max_chars: 8000 # Maximum total character count for human comment bodies in the context snapshot. Oldest entries are dropped first when the cap is exceeded.

# repo_map: # cross-repo dependency map (#312) — uncomment to declare inter-repo relationships
#   # When set, the planning stage fetches open issues from declared repos as supplemental context.
#   # Relationships are declared independently per repo; no reverse-edge inference is performed.
#   depends_on: [] # owner/repo strings this repo consumes (e.g. - acme/shared-lib)
#   depended_on_by: [] # owner/repo strings that consume this repo (e.g. - acme/consumer-app)

# executors: # external stage executors (#314) — uncomment to delegate model-invoking stages to an external agent system or model endpoint. SECURITY: the assigned stage's prompt/context is sent to this external endpoint; credential is an env-var NAME, never a literal secret.
#   opencode-main:
#     type: agent-system # full execution backend (OpenCode/HermesAgent/OpenClaw), valid for any model-invoking stage
#     provider: opencode
#     endpoint: https://opencode.internal/api
#     credential: OPENCODE_API_KEY # env-var NAME resolved at invocation time — never a literal secret value
#   local-ollama:
#     type: model-endpoint # raw OpenAI-compatible chat/completions endpoint; valid ONLY for plan-review/review-1/review-2
#     base_url: http://localhost:11434/v1
#     model: llama3.1:70b

# stage_executors: # assign a name from executors: to a model-invoking stage; unassigned stages use the local claude/codex harness unchanged
#   planning: opencode-main
#   review-1: local-ollama
#   review-2: local-ollama
#   Known model-invoking stages: planning, plan-review, implementing, review-1, fix-1, review-2, fix-2, shipcheck-gate
